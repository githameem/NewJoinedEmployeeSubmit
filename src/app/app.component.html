<nz-layout *ngIf="isfinalSubmit">
  <nz-header>
    <div class="logo">
      <img src="../assets/logo/images.jpg" alt="logo" style="width: 4%;">
    </div>
    <!-- <div class="button-container">
      <button nz-button nzType="primary" [nzSize]="'default'"  title="Refresh!" (click)="ClearStorage()" ><span nz-icon nzType="retweet" nzTheme="outline"></span></button>
      <button nz-button nzType="default">Button 2</button>
    </div> -->
    <div class="button-container" nz-row [nzGutter]="16">
      <div nz-col class="gutter-row" [nzSpan]="6">
        <button nz-button nzType="primary" [nzSize]="'default'"  title="Refresh!" (click)="ClearStorage()" ><span nz-icon nzType="retweet" nzTheme="outline"></span></button>
      </div>
      <div nz-col class="gutter-row" [nzSpan]="10">
        <button nz-button nzType="primary" [nzSize]="'default'"  title="Final Submit" (click)="FinalSubmit()" nzDanger>Final Submit</button>
      </div>
      <div nz-col class="gutter-row" [nzSpan]="2">
       
      </div>
    </div>
  </nz-header>
  <nz-content>
    <div class="inner-content">
      <div class="container">
        <div class="tabs">
          <nz-tabset nzCentered [nzTabPosition]="'left'">
            <nz-tab nzTitle="Basic Info" (nzClick)="navigateTo('/basic/'+ key)"></nz-tab>
            <nz-tab nzTitle="Personal Info" (nzClick)="navigateTo('/personal')"></nz-tab>
            <nz-tab nzTitle="Nominee" (nzClick)="navigateTo('/nominee')"></nz-tab>
            <nz-tab nzTitle="Contact" (nzClick)="navigateTo('/contact')"></nz-tab>
            <nz-tab nzTitle="Education" (nzClick)="navigateTo('/education')"></nz-tab>
            <nz-tab nzTitle="Achivements" (nzClick)="navigateTo('/training')"></nz-tab>
            <nz-tab nzTitle="Passport" (nzClick)="navigateTo('/passport')"></nz-tab>
            <nz-tab nzTitle="Driving License" (nzClick)="navigateTo('/drivinglicense')"></nz-tab>
            <nz-tab nzTitle="Experience" (nzClick)="navigateTo('/experience')"></nz-tab>
            <nz-tab nzTitle="References" (nzClick)="navigateTo('/reference')"></nz-tab>
            <nz-tab nzTitle="Passport Size Photo" (nzClick)="navigateTo('/photo')"></nz-tab>
            <nz-tab nzTitle="Employee Signature" (nzClick)="navigateTo('/signature')"></nz-tab>
          </nz-tabset>
        </div>
        <div class="content">
          <router-outlet></router-outlet>
        </div>
      </div>
    </div>
  </nz-content>
  <nz-footer style="position: fixed; bottom: 0; width: 100%;">©Ha-Meem Group</nz-footer>
</nz-layout>
<nz-layout *ngIf="showFinalSubmitedPage" style="height: 100%;">
  <div class="imagediv">
    <img src="../assets/logo/images.jpg" alt="" style="box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.2), 0 6px 20px 0 rgba(0, 0, 0, 0.19); height: 20%; width: 7%;">
    <nz-result style="font-family: fantasy;" [nzIcon]="'check-circle-twotone'"  [nzTitle]="'Thank you, You have Already Submited Your informations !'">
   </nz-result> 
  </div>
   
</nz-layout>
